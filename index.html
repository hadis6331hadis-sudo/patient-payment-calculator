<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاسبه قیمت نهایی بیمار</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>محاسبه قیمت نهایی بیمار</h1>
        <form id="calcForm">
            <label for="basePrice">قیمت پایه دارو (ریال):</label>
            <input type="number" id="basePrice" required>

            <label for="insurancePrice">قیمت مورد قبول بیمه (ریال):</label>
            <input type="number" id="insurancePrice" required>

            <label for="additionalCost">هزینه اضافی (ریال):</label>
            <input type="number" id="additionalCost" required>

            <button type="submit">محاسبه</button>
        </form>

        <div id="result">
            <h2>نتیجه محاسبه:</h2>
            <p>قیمت پرداختی بیمار: <span id="paymentPrice">0</span> ریال</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
  </html>
